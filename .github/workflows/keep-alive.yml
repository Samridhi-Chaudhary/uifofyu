name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # lets you run it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 "$APP_URL/api/health"
