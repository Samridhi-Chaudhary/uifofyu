name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # lets you run it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 "https://uifofyu.onrender.com/api/health"
